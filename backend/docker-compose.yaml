version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: binhloi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: binhloi
      POSTGRES_USER: binhloi_user
      POSTGRES_PASSWORD: binhloi_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: binhloi_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: .
    container_name: binhloi_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - qdrant

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: https://binhloi.duckdns.org
    container_name: binhloi_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
